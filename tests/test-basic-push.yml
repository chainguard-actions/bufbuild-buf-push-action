name: Test basic push with tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install a fake buf binary that records args
        run: |
          mkdir -p /tmp/fake-buf-bin
          printf '%s\n' '#!/bin/sh' \
            'echo "$@" >> /tmp/buf-calls.log' \
            'echo "fake buf called with: $*"' \
            'exit 0' > /tmp/fake-buf-bin/buf
          chmod +x /tmp/fake-buf-bin/buf
          echo "/tmp/fake-buf-bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          buf_token: fake-token-for-basic-test
          input: "."
      - name: Assert basic push used --tag with SHA
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GITHUB_SHA_VAL: ${{ github.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $GITHUB_SHA_VAL"
          echo "buf calls:"
          cat /tmp/buf-calls.log 2>/dev/null || echo "(no calls recorded)"
          if [ "$OUTCOME" = "success" ]; then
            # Check that --tag was used with the actual SHA
            if grep -q -- "--tag ${GITHUB_SHA_VAL}" /tmp/buf-calls.log 2>/dev/null; then
              echo "PASS: --tag flag used with SHA"
            else
              echo "FAIL: expected --tag ${GITHUB_SHA_VAL} in buf call"
              exit 1
            fi
            # Check that --draft was NOT used in the final push call
            PUSH_CALL=$(grep "push \." /tmp/buf-calls.log 2>/dev/null || true)
            if echo "$PUSH_CALL" | grep -q -- "--draft"; then
              echo "FAIL: --draft should not be used in basic push mode"
              exit 1
            fi
            echo "PASS: basic push used correct flags"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly in basic push mode"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
