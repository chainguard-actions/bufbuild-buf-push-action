name: Test create visibility flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install a fake buf binary that records args
        run: |
          mkdir -p /tmp/fake-buf-bin
          printf '%s\n' '#!/bin/sh' \
            'echo "$@" >> /tmp/buf-calls.log' \
            'echo "fake buf called with: $*"' \
            'exit 0' > /tmp/fake-buf-bin/buf
          chmod +x /tmp/fake-buf-bin/buf
          echo "/tmp/fake-buf-bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          buf_token: fake-token-for-create-test
          input: "."
          create_visibility: "public"
      - name: Assert create flags were used
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GITHUB_SHA_VAL: ${{ github.sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sha: $GITHUB_SHA_VAL"
          echo "buf calls:"
          cat /tmp/buf-calls.log 2>/dev/null || echo "(no calls recorded)"
          if [ "$OUTCOME" = "success" ]; then
            # Check that --create was used in the final push call
            if grep -q -- "--create" /tmp/buf-calls.log 2>/dev/null; then
              echo "PASS: --create flag found in buf call"
            else
              echo "FAIL: expected --create in buf call"
              exit 1
            fi
            # Check that --create-visibility was used with the correct value
            if grep -q -- "--create-visibility public" /tmp/buf-calls.log 2>/dev/null; then
              echo "PASS: --create-visibility public found in buf call"
            else
              echo "FAIL: expected --create-visibility public in buf call"
              exit 1
            fi
            # Check that --tag was used with the actual SHA (non-draft mode)
            if grep -q -- "--tag ${GITHUB_SHA_VAL}" /tmp/buf-calls.log 2>/dev/null; then
              echo "PASS: --tag flag used with SHA"
            else
              echo "FAIL: expected --tag with SHA in non-draft mode"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly with create_visibility"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
