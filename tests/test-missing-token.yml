name: Test missing buf token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install a fake buf binary
        run: |
          mkdir -p /tmp/fake-buf-bin
          cat > /tmp/fake-buf-bin/buf << 'EOF'
          #!/bin/sh
          echo "fake buf called with: $*"
          exit 0
          EOF
          chmod +x /tmp/fake-buf-bin/buf
          echo "/tmp/fake-buf-bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          buf_token: ""
          input: "."
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when buf_token is empty"
          else
            echo "FAIL: expected failure when buf_token is empty, got '$OUTCOME'"
            exit 1
          fi
