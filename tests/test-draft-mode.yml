name: Test draft mode flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install a fake buf binary that records args
        run: |
          mkdir -p /tmp/fake-buf-bin
          printf '%s\n' '#!/bin/sh' \
            'echo "$@" >> /tmp/buf-calls.log' \
            'echo "fake buf called with: $*"' \
            'exit 0' > /tmp/fake-buf-bin/buf
          chmod +x /tmp/fake-buf-bin/buf
          echo "/tmp/fake-buf-bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          buf_token: fake-token-for-draft-test
          input: "."
          draft: "true"
      - name: Assert draft flag was used
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GITHUB_REF_NAME_VAL: ${{ github.ref_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ref_name: $GITHUB_REF_NAME_VAL"
          echo "buf calls:"
          cat /tmp/buf-calls.log 2>/dev/null || echo "(no calls recorded)"
          if [ "$OUTCOME" = "success" ]; then
            # Check that --draft was used with the branch name in the final push call
            if grep -q -- "--draft ${GITHUB_REF_NAME_VAL}" /tmp/buf-calls.log 2>/dev/null; then
              echo "PASS: --draft flag used with branch name"
            else
              echo "FAIL: expected --draft ${GITHUB_REF_NAME_VAL} in buf call"
              exit 1
            fi
            # Check that --tag was NOT used in the final push call (push . line)
            PUSH_CALL=$(grep "push \." /tmp/buf-calls.log 2>/dev/null || true)
            echo "final push call: $PUSH_CALL"
            if echo "$PUSH_CALL" | grep -q -- "--tag"; then
              echo "FAIL: --tag should not be used in draft mode"
              exit 1
            fi
            echo "PASS: draft mode used correct flags"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly in draft mode"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
